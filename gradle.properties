kotlin.code.style=official

# Core Gradle daemon configuration - Docker optimized (2024 best practices)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=2
org.gradle.console=plain
org.gradle.configureondemand=false
org.gradle.logging.level=lifecycle

# Kotlin daemon configuration - Container-aware (2024 optimizations)
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -Dfile.encoding=UTF-8

# Kotlin incremental compilation - Production build settings (2024 stable features)
kotlin.incremental=false
kotlin.incremental.multiplatform=false
kotlin.incremental.js.klib=false
kotlin.incremental.native=false

# Container stability optimizations (2024 research-backed)
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
org.gradle.build-cache=false

# Compose configuration
org.jetbrains.compose.experimental.uikit.enabled=true

# Build optimizations
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Network resilience - Enhanced for Docker (2024 reliability standards)
systemProp.http.socketTimeout=300000
systemProp.http.connectionTimeout=300000
systemProp.https.socketTimeout=300000
systemProp.https.connectionTimeout=300000
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# Kotlin/JS configuration optimized for container builds
kotlin.js.yarn.lockFileDirectory=build/js
kotlin.incremental.js.ir=false

# Container-specific optimizations (2024 additions)
kotlin.data.dir=/tmp/.konan
org.gradle.unsafe.configuration-cache=false
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
