kotlin.code.style=official

# Gradle daemon configuration - optimized for stability and daemon reliability
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
org.gradle.console=plain

# Kotlin daemon configuration - conservative settings for stability
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.incremental.js.klib=true

# Compose configuration
org.jetbrains.compose.experimental.uikit.enabled=true

# Build optimizations
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Network resilience configuration
systemProp.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.https.connectionTimeout=120000

# Kotlin/JS configuration  
kotlin.js.yarn.lockFileDirectory=build/js
kotlin.incremental.js.ir=true
