kotlin.code.style=official

# Core Gradle daemon configuration - Performance optimized for builds
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+UseContainerSupport -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx2g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
org.gradle.console=plain
org.gradle.configureondemand=true
org.gradle.logging.level=lifecycle

# Kotlin daemon configuration - Performance optimized
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Kotlin incremental compilation - Enable for faster builds
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.incremental.js.klib=true
kotlin.incremental.native=false

# Build caching and optimizations - Enable for performance
org.gradle.vfs.watch=false
org.gradle.configuration-cache=true
org.gradle.build-cache=true

# Compose configuration
org.jetbrains.compose.experimental.uikit.enabled=true

# Build optimizations
kotlin.mpp.stability.nowarn=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Network resilience - Enhanced for Docker (2024 reliability standards)
systemProp.http.socketTimeout=300000
systemProp.http.connectionTimeout=300000
systemProp.https.socketTimeout=300000
systemProp.https.connectionTimeout=300000
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# Kotlin/JS configuration optimized for container builds
kotlin.js.yarn.lockFileDirectory=build/js
kotlin.incremental.js.ir=false

# Container-specific optimizations (2024 additions)
kotlin.data.dir=/tmp/.konan
org.gradle.unsafe.configuration-cache=false
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
