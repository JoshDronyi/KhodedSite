# Production Docker Compose Configuration
# Enhanced security, monitoring, and backup capabilities

services:
  # Reverse Proxy with SSL
  nginx:
    image: nginx:1.25-alpine
    container_name: khoded-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/ssl/certs:ro
      - nginx_logs:/var/log/nginx
    networks:
      - khoded_frontend
      - khoded_backend
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application Container
  app:
    build:
      context: ./
      dockerfile: Dockerfile.production
    container_name: khoded-app
    restart: unless-stopped
    expose:
      - 8080
    networks:
      - khoded_backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      - APP_ENVIRONMENT=production
      - DATABASE_URL=jdbc:postgresql://database:5432/khodedBackendData
      - DATABASE_USER=khodedAdmin
      - DATABASE_PASSWORD_FILE=/run/secrets/db_password
      - GOOGLE_SERVICE_ACCOUNT_FILE=/run/secrets/google_service_account
    secrets:
      - db_password
      - google_service_account
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Database
  database:
    image: postgres:16.4-alpine3.19
    container_name: khoded-postgres
    restart: unless-stopped
    expose:
      - 5432
    environment:
      - POSTGRES_DB=khodedBackendData
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_backups:/backups
    networks:
      - khoded_backend
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khodedAdmin -d khodedBackendData"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Backup Service
  db-backup:
    image: postgres:16.4-alpine3.19
    container_name: khoded-backup
    restart: unless-stopped
    environment:
      - POSTGRES_DB=khodedBackendData
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - BACKUP_SCHEDULE=0 2 * * *  # Daily at 2 AM
    secrets:
      - postgres_password
    volumes:
      - db_backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - khoded_backend
    depends_on:
      database:
        condition: service_healthy
    command: crond -f -l 8
    deploy:
      resources:
        limits:
          memory: 256m

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: khoded-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - khoded_backend
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://prometheus.khoded.com'

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:10.0.0
    container_name: khoded-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://grafana.khoded.com
    secrets:
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - khoded_backend
    depends_on:
      - prometheus

  # Log Management - Loki
  loki:
    image: grafana/loki:2.8.0
    container_name: khoded-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - khoded_backend
    command: -config.file=/etc/loki/local-config.yaml

  # Log Collector - Promtail
  promtail:
    image: grafana/promtail:2.8.0
    container_name: khoded-promtail
    restart: unless-stopped
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    networks:
      - khoded_backend
    depends_on:
      - loki
    command: -config.file=/etc/promtail/config.yml

networks:
  khoded_frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  khoded_backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  app_data:
    driver: local
  db_data:
    driver: local
  db_backups:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  nginx_logs:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  google_service_account:
    file: ./secrets/gmail_service_account_key.json
  grafana_password:
    file: ./secrets/grafana_password.txt