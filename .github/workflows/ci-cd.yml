name: Khoded CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2

jobs:
  # Test and Build Job - runs environment-specific tests based on branch
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Enhanced Gradle caching
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/kotlin-dsl
          site/build/js/packages_imported
          site/kotlin-js-store
        key: gradle-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
        restore-keys: |
          gradle-${{ runner.os }}-${{ github.ref_name }}-
          gradle-${{ runner.os }}-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.10.2

    - name: Set up environment
      run: |
        # Create .env from template for testing (no sensitive data)
        cp .env.template .env
        # Set environment based on branch
        case "${{ github.ref_name }}" in
          develop)
            echo "APP_ENVIRONMENT=development" >> .env
            ;;
          main)
            echo "APP_ENVIRONMENT=production" >> .env
            echo "PRIMARY_DOMAIN=khoded.onrender.com" >> .env
            ;;
          *)
            echo "APP_ENVIRONMENT=development" >> .env
            ;;
        esac
        
        # Create dummy secrets for testing
        mkdir -p secrets
        echo '{"type":"service_account","project_id":"test","client_email":"test@test.com","private_key":"dummy"}' > secrets/gmail_service_account_key.json

    - name: Run tests
      run: |
        chmod +x gradlew
        ./gradlew test --no-daemon --console=plain --build-cache --parallel
      env:
        ENVIRONMENT: ${{ github.ref_name }}

    - name: Build application
      run: |
        ./gradlew build --no-daemon --console=plain --build-cache --parallel
      env:
        ENVIRONMENT: ${{ github.ref_name }}

    - name: Build Docker image (for testing)
      run: |
        docker build -f Dockerfile -t khoded:${{ github.ref_name }}-test .

    - name: Test Docker image
      run: |
        docker run --rm khoded:${{ github.ref_name }}-test java -version

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: github.ref_name == 'main'
      with:
        name: build-artifacts
        path: |
          site/build/
          !site/build/tmp/
        retention-days: 30

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to Development (auto-deploy on develop branch)
  deploy-development:
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: github.ref_name == 'develop' && github.event_name == 'push'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build development image
      run: |
        docker build -f Dockerfile -t khoded:dev .

    - name: Deploy to development
      run: |
        echo "🚀 Deploying to development environment"
        echo "Branch: develop"
        echo "Commit: ${{ github.sha }}"
        # Add your development deployment commands here
        # ./scripts/deploy-dev.sh


  # Deploy to Production (manual approval required)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.ref_name == 'main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build production image
      run: |
        docker build -f Dockerfile -t khoded:latest -t khoded:${{ github.sha }} .

    - name: Run production readiness tests
      run: |
        echo "🧪 Running production readiness tests"
        docker run --rm khoded:latest java -version
        # Add production readiness checks
        # docker run --rm khoded:latest curl --version

    - name: Production safety checks
      run: |
        echo "🔒 Running production safety checks"
        echo "Commit: ${{ github.sha }}"
        echo "Author: ${{ github.actor }}"
        echo "Message: ${{ github.event.head_commit.message }}"
        # Add additional safety checks

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment"
        echo "Branch: main"
        echo "Commit: ${{ github.sha }}"
        echo "⚠️ This would trigger production deployment"
        # Add your production deployment commands here
        # ./scripts/deploy-production.sh

    - name: Post-deployment verification
      if: success()
      run: |
        echo "✅ Production deployment successful"
        echo "🔍 Running post-deployment verification"
        # Add production health checks
        # curl -sf https://khoded.com/health

    - name: Notify production deployment
      if: success()
      run: |
        echo "📢 Production deployment notification"
        # Add notification logic (Slack, email, etc.)

  # Deploy to Render.com (production)
  deploy-render:
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.ref_name == 'main' && github.event_name == 'push'
    environment: render-production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Render secrets
      run: |
        if [ -z "${{ secrets.RENDER_SERVICE_ID }}" ] || [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
          echo "⚠️ Render secrets not configured - skipping deployment"
          echo "RENDER_DEPLOY=false" >> $GITHUB_ENV
        else
          echo "✅ Render secrets configured"
          echo "RENDER_DEPLOY=true" >> $GITHUB_ENV
        fi

    - name: Deploy to Render
      if: env.RENDER_DEPLOY == 'true'
      uses: JorgeLNJunior/render-deploy@v1.4.4
      with:
        service_id: ${{ secrets.RENDER_SERVICE_ID }}
        api_key: ${{ secrets.RENDER_API_KEY }}
        wait_deploy: true
        
    - name: Verify Render deployment
      if: env.RENDER_DEPLOY == 'true'
      run: |
        echo "🔍 Verifying Render deployment..."
        # Wait for deployment to be ready
        sleep 30
        # Test the deployed application (replace with your actual domain)
        curl -f https://khoded.onrender.com/health || echo "Health check failed"
        
    - name: Notify Render deployment
      if: env.RENDER_DEPLOY == 'true' && success()
      run: |
        echo "🎉 Successfully deployed to Render.com!"
        echo "Application URL: https://khoded.onrender.com"


  # Code quality and analysis
  code-quality:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Run code analysis
      run: |
        echo "🔍 Running code quality analysis"
        # Add SonarCloud or other code analysis tools
        # ./gradlew sonarqube

    - name: Check code coverage
      run: |
        echo "📊 Checking code coverage"
        # ./gradlew jacocoTestReport  # Disabled - jacoco plugin not configured
        echo "Code coverage analysis would run here"
        # Add coverage threshold checks

  # Database migration validation
  database-migration:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref_name == 'main' && github.event_name == 'push'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: khoded_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' 
        java-version: ${{ env.JAVA_VERSION }}

    - name: Test database migrations
      run: |
        echo "🗄️ Testing database migrations"
        # Add Flyway or other migration testing
        # ./gradlew flywayMigrate -Dflyway.url=jdbc:postgresql://localhost/khoded_test

    - name: Validate schema
      run: |
        echo "✅ Validating database schema"
        # Add schema validation tests