name: Khoded CI/CD Pipeline

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2

jobs:
  # Test and Build Job - runs for all branches
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [development, staging, production]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.10.2

    - name: Set up environment
      run: |
        # Create .env from template for testing (no sensitive data)
        cp .env.template .env
        # Override with CI environment-specific values
        case "${{ matrix.environment }}" in
          development)
            echo "APP_ENVIRONMENT=development" >> .env
            ;;
          staging)
            echo "APP_ENVIRONMENT=staging" >> .env
            echo "PRIMARY_DOMAIN=khoded-staging.onrender.com" >> .env
            ;;
          production)
            echo "APP_ENVIRONMENT=production" >> .env
            echo "PRIMARY_DOMAIN=khoded.onrender.com" >> .env
            ;;
        esac
        
        # Create dummy secrets for testing
        mkdir -p secrets
        echo '{"type":"service_account","project_id":"test","client_email":"test@test.com","private_key":"dummy"}' > secrets/gmail_service_account_key.json

    - name: Run tests
      run: |
        chmod +x gradlew
        ./gradlew test --no-daemon --console=plain
      env:
        ENVIRONMENT: ${{ matrix.environment }}

    - name: Build application
      run: |
        ./gradlew build --no-daemon --console=plain
      env:
        ENVIRONMENT: ${{ matrix.environment }}

    - name: Build Docker image (for testing)
      run: |
        docker build -f Dockerfile -t khoded:${{ matrix.environment }}-test .

    - name: Test Docker image
      run: |
        docker run --rm khoded:${{ matrix.environment }}-test java -version

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: matrix.environment == 'production'
      with:
        name: build-artifacts
        path: |
          site/build/
          !site/build/tmp/
        retention-days: 30

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to Development (auto-deploy on develop branch)
  deploy-development:
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build development image
      run: |
        docker build -f Dockerfile -t khoded:dev .

    - name: Deploy to development
      run: |
        echo "🚀 Deploying to development environment"
        echo "Branch: develop"
        echo "Commit: ${{ github.sha }}"
        # Add your development deployment commands here
        # ./scripts/deploy-dev.sh

  # Deploy to Staging (auto-deploy on staging branch)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx  
      uses: docker/setup-buildx-action@v3

    - name: Build staging image
      run: |
        docker build -f Dockerfile -t khoded:staging .

    - name: Run staging tests
      run: |
        echo "🧪 Running staging-specific tests"
        # Add staging-specific test commands here
        docker run --rm khoded:staging java -version

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment"
        echo "Branch: staging" 
        echo "Commit: ${{ github.sha }}"
        # Add your staging deployment commands here
        # ./scripts/deploy-staging.sh

    - name: Notify staging deployment
      if: success()
      run: |
        echo "✅ Staging deployment successful"
        # Add notification logic (Slack, email, etc.)

  # Deploy to Production (manual approval required)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build production image
      run: |
        docker build -f Dockerfile -t khoded:latest -t khoded:${{ github.sha }} .

    - name: Run production readiness tests
      run: |
        echo "🧪 Running production readiness tests"
        docker run --rm khoded:latest java -version
        # Add production readiness checks
        # docker run --rm khoded:latest curl --version

    - name: Production safety checks
      run: |
        echo "🔒 Running production safety checks"
        echo "Commit: ${{ github.sha }}"
        echo "Author: ${{ github.actor }}"
        echo "Message: ${{ github.event.head_commit.message }}"
        # Add additional safety checks

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment"
        echo "Branch: main"
        echo "Commit: ${{ github.sha }}"
        echo "⚠️ This would trigger production deployment"
        # Add your production deployment commands here
        # ./scripts/deploy-production.sh

    - name: Post-deployment verification
      if: success()
      run: |
        echo "✅ Production deployment successful"
        echo "🔍 Running post-deployment verification"
        # Add production health checks
        # curl -sf https://khoded.com/health

    - name: Notify production deployment
      if: success()
      run: |
        echo "📢 Production deployment notification"
        # Add notification logic (Slack, email, etc.)

  # Deploy to Render.com (production)
  deploy-render:
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: render-production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Render
      uses: JorgeLNJunior/render-deploy@v1.4.4
      with:
        service_id: ${{ secrets.RENDER_SERVICE_ID }}
        api_key: ${{ secrets.RENDER_API_KEY }}
        wait_deploy: true
        
    - name: Verify Render deployment
      run: |
        echo "🔍 Verifying Render deployment..."
        # Wait for deployment to be ready
        sleep 30
        # Test the deployed application (replace with your actual domain)
        curl -f https://khoded.onrender.com/health || echo "Health check failed"
        
    - name: Notify Render deployment
      if: success()
      run: |
        echo "🎉 Successfully deployed to Render.com!"
        echo "Application URL: https://khoded.onrender.com"

  # Performance testing (runs on staging deployments)
  performance-test:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run performance tests
      run: |
        echo "⚡ Running performance tests against staging"
        # Add performance testing tools (k6, Artillery, etc.)
        # k6 run performance-tests/load-test.js

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-results/
        retention-days: 30

  # Code quality and analysis
  code-quality:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Run code analysis
      run: |
        echo "🔍 Running code quality analysis"
        # Add SonarCloud or other code analysis tools
        # ./gradlew sonarqube

    - name: Check code coverage
      run: |
        echo "📊 Checking code coverage"
        ./gradlew jacocoTestReport
        # Add coverage threshold checks

  # Database migration validation
  database-migration:
    runs-on: ubuntu-latest
    needs: test-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: khoded_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' 
        java-version: ${{ env.JAVA_VERSION }}

    - name: Test database migrations
      run: |
        echo "🗄️ Testing database migrations"
        # Add Flyway or other migration testing
        # ./gradlew flywayMigrate -Dflyway.url=jdbc:postgresql://localhost/khoded_test

    - name: Validate schema
      run: |
        echo "✅ Validating database schema"
        # Add schema validation tests