# version field deprecated in Docker Compose v2.35+

services:
  app:
    build:
      context: ./
      # Use the production Dockerfile with all functionality preserved
      dockerfile: Dockerfile.production
    volumes:
      - app_data:/project/site
    container_name: KhodedSite
    ports:
      - 8081:8080
    expose:
      - 8081
    networks:
      - KhodedSiteContainer
    depends_on:
      - database
    # Security and process management (2025 best practices)
    init: true
    ipc: host
    # Memory limit for container-aware JVM (70% of 2GB = ~1.4GB heap)
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      - DATABASE_URL=jdbc:postgresql://database:5432/khodedBackendData
      - DATABASE_USER=khodedAdmin
      - DATABASE_PASSWORD=khodedAdmin
  database:
    image: postgres:16.4-alpine3.19
    environment:
      - POSTGRES_DB=khodedBackendData
      - POSTGRES_PASSWORD=khodedAdmin
    ports:
      - 5432:5432
    expose:
      - 5432
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - KhodedSiteContainer
networks:
  KhodedSiteContainer:
    driver: bridge
volumes:
  app_data:
    driver: local
  db_data:
    driver: local